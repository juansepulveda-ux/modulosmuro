<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planificador Mallsport</title>
<style>
:root{--nav:#17304f;--ink:#172033;--muted:#667085;--line:#dce3eb;--bg:#f3f6fa;--card:#fff;--ok:#e8f7f0;--okText:#126440;--bad:#fff0ed;--badText:#a13a2b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--nav);color:#fff;padding:22px 28px}header h1{margin:0;font-size:24px}header p{margin:6px 0 0;color:#c3d1df;font-size:13px}
main{max-width:1600px;margin:auto;padding:18px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 12px #14263b0b;padding:16px;margin-bottom:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid #cbd5e1;background:#eef3f7;color:#29445f;border-radius:9px;padding:10px 15px;font-weight:750;cursor:pointer}.tab.active{background:var(--nav);color:#fff;border-color:var(--nav)}
.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:12px}.field{display:grid;gap:5px;font-size:12px;font-weight:700;color:#536275}.field input,.field select{height:38px;border:1px solid #cbd5e1;border-radius:8px;padding:0 10px;font:inherit;background:#fff;min-width:160px}
button{border:0;border-radius:8px;background:#1e4566;color:#fff;padding:10px 14px;font-weight:700;cursor:pointer}button.secondary{background:#e8eef4;color:#23415b}button.danger{background:#a33b32}button:disabled{opacity:.45;cursor:not-allowed}.muted{font-size:12px;color:var(--muted);line-height:1.45}
.status{margin-top:10px;padding:10px 12px;border-radius:8px;font-size:12px}.status.ok{background:var(--ok);color:var(--okText)}.status.bad{background:var(--bad);color:var(--badText)}
.frame{width:100%;height:1050px;border:1px solid var(--line);border-radius:12px;background:#fff}.hidden{display:none!important}
.pubhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.pubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:12px}.pubitem{border:1px solid var(--line);border-radius:11px;padding:12px;background:#fbfcfe}.pubitem b{font-size:15px}.pubitem .meta{font-size:11px;color:var(--muted);margin:4px 0 10px}.pubitem .actions{display:flex;gap:7px;flex-wrap:wrap}
@media(max-width:800px){main{padding:10px}header{padding:18px 14px}.frame{height:900px}.field{width:100%}.field input,.field select{width:100%}}
</style>
</head>
<body>
<header><h1>Planificador Mallsport</h1><p>Muro de escalada + Airtrail/Tirolesa · publicación por fecha</p></header>
<main>
  <section class="card">
    <div class="tabs">
      <button class="tab active" data-type="muro">Muro de escalada</button>
      <button class="tab" data-type="airtrail">Airtrail + Tirolesa</button>
    </div>
    <div class="controls">
      <label class="field">Usuario<input id="username" autocomplete="username" placeholder="administracion"></label>
      <label class="field">Contraseña<input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></label>
      <button id="publish">Publicar jornada actual</button>
      <button class="secondary" id="openViewer">Abrir visor público</button>
    </div>
    <div class="muted">La fecha se toma de la planificación activa. Publicar una fecha ya existente la reemplaza; las otras jornadas permanecen intactas.</div>
    <div id="status"></div>
  </section>

  <section class="card" style="padding:8px">
    <iframe id="muroFrame" class="frame" src="/planificador_muro.html?embed=1" title="Planificador Muro"></iframe>
    <iframe id="airtrailFrame" class="frame hidden" src="/planificador_airtrail.html?embed=1" title="Planificador Airtrail y Tirolesa"></iframe>
  </section>

  <section class="card">
    <div class="pubhead">
      <div><b>Jornadas publicadas</b><div class="muted">Revisa, abre o elimina jornadas ya publicadas.</div></div>
      <div class="controls" style="margin-top:0">
        <label class="field">Mes<input type="month" id="month"></label>
        <button class="secondary" id="refresh">Actualizar lista</button>
      </div>
    </div>
    <div id="published" class="pubgrid"></div>
  </section>
</main>
<script>
let activeType='muro', waiting=null;
const $=id=>document.getElementById(id);
const typeLabel=t=>t==='muro'?'Muro de escalada':'Airtrail + Tirolesa';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(text,kind='ok'){$('status').innerHTML=`<div class="status ${kind}">${esc(text)}</div>`}
function setType(t){activeType=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.type===t));$('muroFrame').classList.toggle('hidden',t!=='muro');$('airtrailFrame').classList.toggle('hidden',t!=='airtrail');refreshList()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setType(b.dataset.type));
$('month').value=new Date().toLocaleDateString('en-CA').slice(0,7);
function requestPlan(){return new Promise((resolve,reject)=>{const id=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();const frame=activeType==='muro'?$('muroFrame'):$('airtrailFrame');const timer=setTimeout(()=>{waiting=null;reject(new Error('El planificador no respondió.'))},3000);waiting={id,resolve,reject,timer};frame.contentWindow.postMessage({type:'request-current-plan',requestId:id},'*')})}
window.addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='planner-current-plan'||!waiting||d.requestId!==waiting.id)return;clearTimeout(waiting.timer);const w=waiting;waiting=null;w.resolve(d)});
$('publish').onclick=async()=>{try{const username=$('username').value.trim(),password=$('password').value;if(!username||!password)throw new Error('Ingresa usuario y contraseña.');const r=await requestPlan();if(!r.plan)throw new Error('Primero genera una planificación en la pestaña activa.');if(!/^\d{4}-\d{2}-\d{2}$/.test(r.date||''))throw new Error('Selecciona una fecha válida para la jornada.');if(r.planner!==activeType)throw new Error('La planificación activa no coincide con la pestaña seleccionada.');$('publish').disabled=true;$('publish').textContent='Publicando…';const res=await fetch('/api/jornadas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password,type:activeType,date:r.date,plan:r.plan})});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||`Error ${res.status}`);msg(`${typeLabel(activeType)} · ${r.date} publicado correctamente.`);$('password').value='';await refreshList()}catch(e){msg(e.message,'bad')}finally{$('publish').disabled=false;$('publish').textContent='Publicar jornada actual'}};
async function refreshList(){const box=$('published');box.innerHTML='<div class="muted">Cargando…</div>';try{const res=await fetch(`/api/jornadas?type=${encodeURIComponent(activeType)}&action=list`,{cache:'no-store'});const data=await res.json();if(!res.ok)throw new Error(data.error||'No se pudo obtener la lista.');const month=$('month').value;const items=(data.items||[]).filter(x=>!month||x.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date));if(!items.length){box.innerHTML='<div class="muted">No hay jornadas publicadas para este mes.</div>';return}box.innerHTML=items.map(x=>`<div class="pubitem"><b>${esc(x.date)}</b><div class="meta">${esc(typeLabel(activeType))}${x.size?` · ${(x.size/1024).toFixed(1)} KB`:''}</div><div class="actions"><button class="secondary" data-view="${esc(x.date)}">Ver</button><button class="danger" data-del="${esc(x.date)}">Eliminar</button></div></div>`).join('')}catch(e){box.innerHTML=`<div class="status bad">${esc(e.message)}</div>`}}
$('refresh').onclick=refreshList;$('month').onchange=refreshList;
$('published').onclick=async e=>{const view=e.target.dataset.view,del=e.target.dataset.del;if(view){window.open(`/?type=${activeType}&date=${encodeURIComponent(view)}`,'_blank','noopener');return}if(del){const username=$('username').value.trim(),password=$('password').value;if(!username||!password){msg('Ingresa usuario y contraseña para eliminar una publicación.','bad');return}if(!confirm(`¿Eliminar ${typeLabel(activeType)} del ${del}?`))return;try{e.target.disabled=true;const res=await fetch('/api/jornadas',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password,type:activeType,date:del})});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||`Error ${res.status}`);msg(`${del} eliminado.`);$('password').value='';await refreshList()}catch(err){msg(err.message,'bad')}finally{e.target.disabled=false}}};
$('openViewer').onclick=()=>window.open(`/?type=${activeType}`,'_blank','noopener');
refreshList();
</script>
</body></html>
