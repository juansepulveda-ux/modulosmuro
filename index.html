<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planificación Mallsport</title>
<style>
:root{--nav:#17304f;--ink:#172033;--muted:#667085;--line:#dce3eb;--bg:#f3f6fa;--module:#e7f0ff;--support:#e5f6eb;--free:#f3f4f6;--poles:#fff2cf;--break:#fff4cf}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--nav);color:#fff;padding:22px 28px}header h1{margin:0;font-size:24px}header p{margin:6px 0 0;color:#c6d3df;font-size:13px}main{max-width:1600px;margin:auto;padding:18px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px #14263b0b}.tabs,.subtabs{display:flex;gap:8px;flex-wrap:wrap}.tab,.subtab{border:1px solid #cbd5e1;background:#edf2f6;color:#29445f;border-radius:9px;padding:9px 14px;font-weight:750;cursor:pointer}.tab.active,.subtab.active{background:var(--nav);color:#fff;border-color:var(--nav)}.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:12px}.field{display:grid;gap:5px;font-size:12px;font-weight:700;color:#536275}.field select{height:38px;border:1px solid #cbd5e1;border-radius:8px;padding:0 10px;font:inherit;background:#fff;min-width:190px}.muted{font-size:12px;color:var(--muted)}.status{padding:10px 12px;border-radius:8px;background:#fff4d8;color:#7a5a00;font-size:12px}.wrap{overflow:auto;max-height:75vh;border:1px solid var(--line);border-radius:10px;margin-top:12px}table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}th,td{border-bottom:1px solid #e5eaf0;border-right:1px solid #edf0f4;padding:8px 9px;text-align:center;white-space:nowrap;min-width:120px}th{position:sticky;top:0;background:#20384f;color:#fff;z-index:3}th:first-child,td:first-child{position:sticky;left:0;z-index:2;background:#f8fafc;min-width:130px}th:first-child{z-index:4;background:#20384f}.module{background:var(--module)}.support{background:var(--support)}.free{background:var(--free);color:#6b7280}.poles{background:var(--poles)}.break{background:var(--break);color:#7b5a00}.name{font-weight:800;font-size:11px}.detail{font-size:10px;color:#5a677a;margin-top:2px}.hidden{display:none!important}.summary{display:flex;gap:10px;flex-wrap:wrap}.pill{background:#edf2f7;border-radius:999px;padding:6px 10px;font-size:11px;color:#46566b}
@media(max-width:700px){main{padding:10px}header{padding:18px 14px}.field{width:100%}.field select{width:100%}}
</style></head><body>
<header><h1>Planificación Mallsport</h1><p>Consulta de jornadas publicadas</p></header><main>
<section class="card"><div class="tabs"><button class="tab active" data-type="muro">Muro de escalada</button><button class="tab" data-type="airtrail">Airtrail + Tirolesa</button></div><div class="controls"><label class="field">Fecha<select id="dateSelect"></select></label><button class="tab" id="reload">Actualizar</button></div><div id="headStatus" class="muted" style="margin-top:10px"></div></section>
<section class="card"><div class="subtabs"><button class="subtab active" data-view="general">Vista general</button><button class="subtab" data-view="personal">Mi horario</button><button class="subtab" data-view="modules">Módulos</button></div><div id="personalControls" class="controls hidden"><label class="field">Monitor<select id="personSelect"></select></label></div><div id="summary" class="summary" style="margin-top:12px"></div><div id="content" class="wrap"><div class="muted" style="padding:18px">Selecciona una jornada.</div></div></section>
</main><script>
let activeType='muro',activeView='general',plan=null,dates=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pad=n=>String(n).padStart(2,'0');const hh=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
function labelType(t){return t==='muro'?'Muro de escalada':'Airtrail + Tirolesa'}
function parseQuery(){const q=new URLSearchParams(location.search);if(['muro','airtrail'].includes(q.get('type')))activeType=q.get('type');return q.get('date')||''}
const requestedDate=parseQuery();
function setTabs(){document.querySelectorAll('.tab[data-type]').forEach(b=>b.classList.toggle('active',b.dataset.type===activeType));document.querySelectorAll('.subtab').forEach(b=>b.classList.toggle('active',b.dataset.view===activeView));$('personalControls').classList.toggle('hidden',activeView!=='personal')}
document.querySelectorAll('.tab[data-type]').forEach(b=>b.onclick=()=>{activeType=b.dataset.type;history.replaceState(null,'',`/?type=${activeType}`);loadDates()});document.querySelectorAll('.subtab').forEach(b=>b.onclick=()=>{activeView=b.dataset.view;setTabs();render()});
async function loadDates(prefer=''){setTabs();$('dateSelect').innerHTML='<option>Cargando…</option>';$('content').innerHTML='<div class="muted" style="padding:18px">Cargando jornadas…</div>';try{const r=await fetch(`/api/jornadas?type=${activeType}&action=list`,{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error||'No se pudieron cargar las fechas.');dates=(d.items||[]).sort((a,b)=>a.date.localeCompare(b.date));if(!dates.length){$('dateSelect').innerHTML='<option value="">Sin jornadas</option>';plan=null;render();return}const wanted=prefer||requestedDate;const chosen=dates.some(x=>x.date===wanted)?wanted:(dates.find(x=>x.date>=new Date().toLocaleDateString('en-CA'))?.date||dates[dates.length-1].date);$('dateSelect').innerHTML=dates.map(x=>`<option value="${esc(x.date)}" ${x.date===chosen?'selected':''}>${esc(x.date)}</option>`).join('');await loadPlan(chosen)}catch(e){$('headStatus').textContent=e.message;$('content').innerHTML=`<div class="status">${esc(e.message)}</div>`}}
async function loadPlan(date){if(!date)return;try{$('headStatus').textContent='Cargando…';const r=await fetch(`/api/jornadas?type=${activeType}&date=${encodeURIComponent(date)}`,{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error||'No se pudo cargar la jornada.');plan=d.plan;history.replaceState(null,'',`/?type=${activeType}&date=${encodeURIComponent(date)}`);$('headStatus').textContent=`${labelType(activeType)} · ${date}`;populatePeople();render()}catch(e){plan=null;$('headStatus').textContent=e.message;render()}}
$('dateSelect').onchange=()=>loadPlan($('dateSelect').value);$('reload').onclick=()=>loadDates($('dateSelect').value);
function staffList(){if(!plan)return[];return plan.staff||[]}
function personId(p){return activeType==='muro'?p.id:String(p.idx)}function personName(p){return p.nick||p.name||p.full||personId(p)}
function populatePeople(){const people=staffList();const old=$('personSelect').value;$('personSelect').innerHTML=people.map(p=>`<option value="${esc(personId(p))}" ${personId(p)===old?'selected':''}>${esc(personName(p))}</option>`).join('')}
$('personSelect').onchange=render;
function muroColors(id){const bg=['#dfeeff','#e8f5e3','#f9e7ef'][(Number(id)-1)%3],fg=['#234b70','#315c35','#7b3f59'][(Number(id)-1)%3];return {bg,fg}}
function airColors(id){const h=(Number(id)*47+18)%360;return {bg:`hsl(${h} 68% 91%)`,fg:`hsl(${h} 42% 27%)`}}
function muroActivity(a){if(!a)return ['Libre','free'];const names={REC:'Recepción de niños',B:'Boulder',R:'Ruta',D:'Despedida de niños',AP:'Apoyo en ruta'};return [names[a.code]||a.code,'module']}
function airCategory(t){if(!t)return ['Libre','free'];if(t.role==='break')return ['Break','break'];if(t.role==='equipMain'||t.role==='equipSupport')return ['Equipamiento','module'];if(t.role==='launchMain'||t.role==='launchSupport')return ['Lanzamiento','module'];if(t.role==='polesSupport'||t.role==='polesTransfer')return ['Poleas','poles'];if(t.role==='brakeMain')return ['Freno','module'];return [t.label||t.role,'module']}
function generalRows(){if(activeType==='muro'){const people=plan.staff;return {heads:['Horario',...people.map(personName)],rows:plan.rows.map(r=>[`${r.start} – ${r.end}`,...people.map(p=>{const a=r.assignments[p.id],x=muroActivity(a),c=a?muroColors(a.module):null;return {text:x[0],cls:x[1],detail:a?`Módulo ${a.module}`:'',style:c?`background:${c.bg};color:${c.fg}`:''}})])}}const people=orderedAirStaff();return {heads:['Horario',...people.map(personName)],rows:(plan.timeline||[]).map(r=>[`${hh(r.start)} – ${hh(r.end)}`,...people.map(p=>{const t=r.cells?.[p.idx],x=airCategory(t),c=t&&t.moduleId?airColors(t.moduleId):null;return {text:x[0],cls:x[1],detail:t&&t.moduleId?`Módulo ${t.moduleId}`:(t&&t.role==='break'?`${hh(t.start)}–${hh(t.end)}`:''),style:c?`background:${c.bg};color:${c.fg}`:''}})])}}
function orderedAirStaff(){const order=[];if(plan.groupInfo){(plan.groupInfo.equip||[]).forEach(x=>!order.includes(x)&&order.push(x));(plan.groupInfo.tower||[]).forEach(x=>!order.includes(x)&&order.push(x));if(plan.groupInfo.poles!=null&&!order.includes(plan.groupInfo.poles))order.push(plan.groupInfo.poles)}(plan.staff||[]).forEach(p=>!order.includes(p.idx)&&order.push(p.idx));return order.map(id=>(plan.staff||[]).find(p=>p.idx===id)).filter(Boolean)}
function renderTable(data){$('content').innerHTML=`<table><thead><tr>${data.heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${data.rows.map(row=>`<tr>${row.map((c,i)=>{if(typeof c==='string')return `<td>${esc(c)}</td>`;return `<td class="${esc(c.cls||'')}" style="${esc(c.style||'')}"><div class="name">${esc(c.text)}</div>${c.detail?`<div class="detail">${esc(c.detail)}</div>`:''}</td>`}).join('')}</tr>`).join('')}</tbody></table>`}
function renderGeneral(){renderTable(generalRows())}
function renderPersonal(){const id=$('personSelect').value;if(!id){$('content').innerHTML='<div class="muted" style="padding:18px">No hay monitores.</div>';return}const g=generalRows();const people=activeType==='muro'?plan.staff:orderedAirStaff();const idx=people.findIndex(p=>personId(p)===id);renderTable({heads:['Horario',people[idx]?personName(people[idx]):'Monitor'],rows:g.rows.map(r=>[r[0],r[idx+1]])})}
function renderModules(){if(activeType==='muro'){const rows=(plan.modules||[]).map(m=>{const pri=(plan.staff||[]).find(p=>p.id===m.primary);const supportIds=m.support?[m.support]:[...new Set(Object.values(m.supports||{}).flat())];const sup=supportIds.map(id=>(plan.staff||[]).find(p=>p.id===id)).filter(Boolean).map(personName).join(', ')||'—';const c=muroColors(m.id),style=`background:${c.bg};color:${c.fg}`;return [String(m.id),hh(m.start),hh(m.end),personName(pri||{}),sup].map(text=>({text,style}))});renderTable({heads:['Módulo','Inicio','Término','Responsable','Apoyo en ruta'],rows})}else{const name=id=>{const p=(plan.staff||[]).find(x=>x.idx===id);return p?personName(p):'—'};const namesFor=(m,roles)=>{const ids=[];roles.forEach(role=>(m.assign?.[role]||[]).forEach(t=>{if(t.assigned!=null&&!ids.includes(t.assigned))ids.push(t.assigned)}));return ids.length?ids.map(name).join(' + '):'—'};const rows=(plan.modules||[]).map(m=>{const c=airColors(m.id),style=`background:${c.bg};color:${c.fg}`;return [String(m.id),hh(m.start),namesFor(m,['equipMain','equipSupport']),namesFor(m,['launchMain','launchSupport']),namesFor(m,['polesSupport']),namesFor(m,['brakeMain'])].map(text=>({text,style}))});renderTable({heads:['Módulo','Inicio','Equipamiento','Lanzamiento','Poleas','Freno'],rows})}}
function render(){if(!plan){$('summary').innerHTML='';$('content').innerHTML='<div class="muted" style="padding:18px">No hay una jornada seleccionada.</div>';return}setTabs();$('summary').innerHTML=`<span class="pill">${esc(plan.date||$('dateSelect').value)}</span><span class="pill">${(plan.modules||[]).length} módulos</span><span class="pill">${(plan.staff||[]).length} monitores</span>`;if(activeView==='general')renderGeneral();else if(activeView==='personal')renderPersonal();else renderModules()}
setTabs();loadDates(requestedDate);
</script></body></html>
